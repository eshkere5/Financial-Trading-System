
llm_strategist:
  enabled: true

  # provider/base_url/model/api_key берутся из configs/llm_shared.yaml — единая
  # точка настройки для всего проекта (раньше эти ключи дублировались в трёх
  # местах и расходились). См. merge_llm_section() в config_loader.py.

  # thinking-режим V4: true = глубже рассуждает, дороже и медленнее.
  # Для 15-минутного supervisor-цикла достаточно false.
  thinking: false

  temperature: 0.2
  max_tokens: 6000
  timeout_seconds: 60

  # ── цикл супервизора ───────────────────────────────────────────────────────
  # Как часто стратег переоценивает рынок (секунды). 900 = 15 минут.
  # Стоимость: ~2-4k токенов на вызов → < $0.002/вызов → ~ $0.2/день
  poll_interval: 900

  # ── журнал решений ─────────────────────────────────────────────────────────
  # JSONL-файл — источник данных для веб-дашборда (следующая фаза)
  decision_log: "data/strategist_decisions.jsonl"

  # ── границы полномочий LLM (hard limits, LLM не может их превысить) ───────
  # Максимальный множитель размера, который может выставить стратег
  max_size_multiplier: 1.5
  # Может ли стратег останавливать торговлю (halt)
  allow_halt: true
  # Максимум пар в veto-списке
  max_vetoed_pairs: 20
