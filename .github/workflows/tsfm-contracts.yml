name: TSFM offline contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]" huggingface_hub
      - run: python -m pytest tests/test_tsfm_integration.py tests/test_analytics_feeder.py tests/test_architecture.py -q
